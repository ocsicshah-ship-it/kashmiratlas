[project]
name = "atlas-pipeline"
version = "0.1.0"
description = "H3 grid generation, zonal aggregation and capability scoring for the Kashmir Valley Capability Atlas."
requires-python = ">=3.11"
dependencies = [
    "h3>=4.1,<5",
    "shapely>=2.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "psycopg[binary]>=3.1",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
# Heavy geospatial deps only needed once real rasters are ingested (Phase 1+).
raster = [
    "rasterio>=1.3",
    "geopandas>=0.14",
    "exactextract>=0.2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
atlas-pipeline = "atlas_pipeline.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atlas_pipeline*"]

[tool.ruff]
line-length = 100
