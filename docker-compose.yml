services:
  postgis:
    # Stock PostGIS is sufficient — H3 math runs in Python (pipeline + API).
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
      POSTGRES_DB: ${POSTGRES_DB:-kashmiratlas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Migrations run automatically on first boot (empty data dir) in lexical order.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-kashmiratlas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: kashmiratlas/api:dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas}@postgis:5432/${POSTGRES_DB:-kashmiratlas}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000}
      ATLAS_WEB_DIR: /srv/web
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Serve the designed atlas page same-origin with the API.
      - ./web:/srv/web:ro
    depends_on:
      postgis:
        condition: service_healthy

volumes:
  pgdata:
